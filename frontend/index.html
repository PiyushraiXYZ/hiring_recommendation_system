<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hiring Recommendation Tool</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-border: #262b36;
    --text: #e8eaed;
    --muted: #8a91a1;
    --accent: #6c8cff;
    --accent-2: #35d0a1;
    --danger: #ff6c6c;
    --warn: #ffb020;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }
  header {
    margin-bottom: 28px;
  }
  header h1 {
    font-size: 1.6rem;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  header p {
    color: var(--muted);
    margin: 0;
    font-size: 0.95rem;
  }
  .layout {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }
  @media (min-width: 860px) {
    .layout { grid-template-columns: 380px 1fr; }
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 20px;
  }
  .card h2 {
    font-size: 1rem;
    margin: 0 0 16px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
  }
  label {
    display: block;
    font-size: 0.85rem;
    margin: 14px 0 6px;
    color: var(--muted);
  }
  label:first-of-type { margin-top: 0; }
  input {
    width: 100%;
    padding: 10px 12px;
    background: #0d0f13;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.9rem;
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .hint {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 4px;
  }
  button {
    width: 100%;
    margin-top: 22px;
    padding: 12px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .results-empty {
    color: var(--muted);
    text-align: center;
    padding: 60px 20px;
    font-size: 0.9rem;
  }
  .compare-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 16px;
  }
  .score-panel {
    background: #0d0f13;
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 16px;
  }
  .score-panel h3 {
    margin: 0 0 12px;
    font-size: 0.85rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .final-score {
    font-size: 2.2rem;
    font-weight: 700;
    margin-bottom: 14px;
  }
  .metric-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    padding: 6px 0;
    border-bottom: 1px solid var(--panel-border);
  }
  .metric-row:last-child { border-bottom: none; }
  .metric-label { color: var(--muted); }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: 600;
    margin-left: 6px;
  }
  .badge.high { background: rgba(53, 208, 161, 0.15); color: var(--accent-2); }
  .badge.medium { background: rgba(255, 176, 32, 0.15); color: var(--warn); }
  .badge.low { background: rgba(255, 108, 108, 0.15); color: var(--danger); }

  .divergence {
    background: rgba(255, 176, 32, 0.08);
    border: 1px solid rgba(255, 176, 32, 0.25);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 0.85rem;
    color: var(--warn);
    margin-top: 4px;
  }
  .error-box {
    background: rgba(255, 108, 108, 0.1);
    border: 1px solid rgba(255, 108, 108, 0.3);
    color: var(--danger);
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 0.85rem;
  }
  .api-url-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 20px;
  }
  .api-url-row input { flex: 1; }
  .api-url-row span {
    font-size: 0.75rem;
    color: var(--muted);
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Hiring Recommendation Tool</h1>
    <p>Enter candidate details to compare the rule-based and ML-based scoring engines.</p>
  </header>

  <div class="api-url-row">
    <span>API base URL:</span>
    <input id="apiUrl" value="http://localhost:8000" />
  </div>

  <div class="layout">
    <div class="card">
      <h2>Candidate Details</h2>

      <label>Job durations (months, comma-separated)</label>
      <input id="jobDurations" value="12, 18, 24" />
      <div class="hint">e.g. lengths of previous roles</div>

      <label>Number of companies worked at</label>
      <input id="companies" type="number" value="3" />

      <label>Total experience (years)</label>
      <input id="experience" type="number" step="0.1" value="4.5" />

      <label>Current salary</label>
      <input id="currentSalary" type="number" step="0.1" value="8" />

      <label>Expected salary</label>
      <input id="expectedSalary" type="number" step="0.1" value="12" />

      <label>Candidate skills (comma-separated)</label>
      <input id="candidateSkills" value="Python, FastAPI, PostgreSQL" />

      <label>Company required skills (comma-separated)</label>
      <input id="companySkills" value="Python, FastAPI, Git, Docker" />

      <button id="submitBtn">Calculate Recommendation</button>
    </div>

    <div class="card">
      <h2>Results</h2>
      <div id="results">
        <div class="results-empty">Fill in the candidate details and click "Calculate Recommendation" to see scores.</div>
      </div>
    </div>
  </div>
</div>

<script>
const submitBtn = document.getElementById('submitBtn');
const resultsEl = document.getElementById('results');

function parseList(str) {
  return str.split(',').map(s => s.trim()).filter(Boolean);
}

function parseNumberList(str) {
  return parseList(str).map(Number);
}

function badgeClass(rec) {
  if (!rec) return 'medium';
  const r = rec.toLowerCase();
  if (r.includes('very high') || r === 'high') return 'high';
  if (r === 'medium') return 'medium';
  return 'low';
}

function renderPanel(title, data) {
  return `
    <div class="score-panel">
      <h3>${title}</h3>
      <div class="final-score">${data.final_score}</div>
      <div class="metric-row"><span class="metric-label">Stability</span><span>${data.stability}</span></div>
      <div class="metric-row"><span class="metric-label">Long-term probability</span><span>${data.long_term_probability}<span class="badge ${badgeClass(data.long_term_recommendation)}">${data.long_term_recommendation}</span></span></div>
      <div class="metric-row"><span class="metric-label">Monetary motivation</span><span>${data.monetary}</span></div>
      <div class="metric-row"><span class="metric-label">Cultural fit</span><span>${data.culture}</span></div>
    </div>
  `;
}

submitBtn.addEventListener('click', async () => {
  const apiUrl = document.getElementById('apiUrl').value.replace(/\/$/, '');

  const payload = {
    job_durations: parseNumberList(document.getElementById('jobDurations').value),
    companies: Number(document.getElementById('companies').value),
    experience: Number(document.getElementById('experience').value),
    current_salary: Number(document.getElementById('currentSalary').value),
    expected_salary: Number(document.getElementById('expectedSalary').value),
    candidate_skills: parseList(document.getElementById('candidateSkills').value),
    company_skills: parseList(document.getElementById('companySkills').value)
  };

  submitBtn.disabled = true;
  submitBtn.textContent = 'Calculating...';
  resultsEl.innerHTML = '<div class="results-empty">Loading...</div>';

  try {
    const res = await fetch(`${apiUrl}/score`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (!res.ok) {
      const errData = await res.json().catch(() => ({}));
      throw new Error(errData.detail || `Request failed with status ${res.status}`);
    }

    const data = await res.json();
    const diff = Math.abs(data.rule_based.final_score - data.ml_based.final_score);

    let html = '<div class="compare-grid">';
    html += renderPanel('Rule-Based Engine', data.rule_based);
    html += renderPanel('ML Model (RandomForest)', data.ml_based);
    html += '</div>';

    if (diff >= 15) {
      html += `<div class="divergence">⚠ The two engines disagree noticeably (${diff.toFixed(1)} pt difference in final score). The rule-based engine uses fixed thresholds; the ML model learned patterns from the training data — worth reviewing both before deciding.</div>`;
    }

    resultsEl.innerHTML = html;
  } catch (err) {
    resultsEl.innerHTML = `<div class="error-box">Error: ${err.message}. Make sure the API is running and the URL above is correct (CORS is enabled on the API for local use).</div>`;
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Calculate Recommendation';
  }
});
</script>
</body>
</html>
